name: Test Package

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Test
        run: go test -tags '!e2e' -v ./... -cover

  govuln:
    name: Govulncheck & Code Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck → SARIF
        run: |
          govulncheck -format sarif ./... > govulncheck.sarif

      - name: Fix duplicate SARIF stacks
        run: |
          jq '(.runs[].results[].stacks? // empty) |= unique' \
            govulncheck.sarif > fixed.sarif
          mv fixed.sarif govulncheck.sarif

      - name: Upload govulncheck SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: govulncheck.sarif
